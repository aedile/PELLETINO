# MINIMAME game manifest
# ============================================================================
# Every game listed here is pre-approved: artwork exists, a driver exists or is
# planned, and a partition slot can be reserved for it. This file is the ONLY
# place you choose what a build contains.
#
# HOW A GAME GETS INTO YOUR BUILD
#
#   Drop its ROM zip into roms/ using the MAME name below, e.g. roms/galaga.zip
#
# That is the whole procedure. `./minimame build` finds it, reserves a slot,
# puts its marquee in the menu, and leaves everything else out. Games whose ROM
# you do not have are simply absent - no slot, no menu entry, no wasted flash.
#
# To override the automatic behaviour, set `enabled` on a game:
#   enabled = false   never build it, even if the ROM is present
#   enabled = true    always build it (it will fail loudly if the ROM is missing)
#
# We ship no ROMs. Supplying them is your responsibility.
# ============================================================================

[build]
flash_mb      = 16      # W25Q128 on the ESP32-C6-LCD-1.69
launcher_kb   = 512     # the menu's own slot
default_slot_kb = 768   # for games whose size we have not measured yet

# --- measured: every one of these has a working build, and the slot is its measured
# --- binary size rounded up to 64 KB with at least ten percent to spare. Sizes as of 9 September 2026.

# GHOSTERAMA carries BOTH Pac-Man and Ms. Pac-Man in one image and picks between them
# at boot. Ms. Pac-Man owns the slot; Pac-Man rides it via `boots` below, so the pair
# costs one 1 MB slot, not two. Selecting either records which one the image should run.
[[game]]
rom = "mspacman"
title = "Ms. Pac-Man"
project = "GHOSTERAMA"
binary = "build_docker/pelletino.bin"   # one image carries both Pac-Men; picked at boot
slot_kb = 1024

