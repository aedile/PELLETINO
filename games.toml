# Street Fighter II comes two ways, and a build holds one, because each needs a data
# partition and a build has room for one. Both show the attract mode; neither is played.
#
# Emulated: the real ROM on a CPS-1 emulator (games/SHORYUKEN/README.md has every
# measurement). roms.bin is made from sf2.zip by games/SHORYUKEN/tools/convert_roms.py.
# The slot is the largest configuration (686 KB, CROP with all the sound) with ten percent
# to spare; the data partition is 2 MB bigger than the video's.
[[game]]
rom = "sf2"
title = "Street Fighter II"
by = "Capcom 1991"
project = "SHORYUKEN"
slot_kb = 768
data_kb = 7616
data_file = "roms.bin"

# As a video: the attract mode as a clip, letterboxed and looped, in a 5.5 MB data
# partition. Pack one with games/HADOUKEN/tools/pack_media.py. Switched off; to have this
# one instead, give SHORYUKEN enabled = false and delete the line below.
[[game]]
rom = "sf2"
title = "Street Fighter II"
by = "Capcom 1991"
project = "HADOUKEN"
slot_kb = 512
data_kb = 5504
data_file = "media.bin"
enabled = false

